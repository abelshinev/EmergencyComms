<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Comms - Passenger Client</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
      --code-bg: #09090b;
      --success: #34d399;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      color: var(--text);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-emergency {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background 0.2s ease;
    }

    .btn-emergency:hover {
      background-color: var(--primary-hover);
    }

    .btn-emergency:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 24px 0;
    }

    .response-header {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--success);
      overflow-x: auto;
      margin: 0;
      min-height: 100px;
    }

    pre.error {
      color: var(--primary);
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>🚨 Emergency Assistance</h1>

    <div class="field">
      <label for="endpoint">Server Endpoint</label>
      <input type="text" id="endpoint" value="http://localhost:3000/emergency">
    </div>

    <div class="field">
      <label for="deviceId">Device ID</label>
      <input type="text" id="deviceId" value="DEV001">
    </div>

    <button id="emergencyBtn" class="btn-emergency" onclick="triggerEmergency()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">EMERGENCY BUTTON</span>
    </button>

    <div class="divider"></div>

    <div class="response-header">Response</div>
    <pre id="responseBox">Press the Emergency Button to test lookup service...</pre>
  </div>
</div>

<script>
  async function triggerEmergency() {
    const endpoint = document.getElementById('endpoint').value.trim();
    const deviceId = document.getElementById('deviceId').value.trim();
    const responseBox = document.getElementById('responseBox');
    const emergencyBtn = document.getElementById('emergencyBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    emergencyBtn.disabled = true;
    spinner.style.display = 'inline-block';
    btnText.innerText = 'SENDING...';
    responseBox.classList.remove('error');
    responseBox.innerText = 'Sending POST request...';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceId: deviceId })
      });

      const data = await res.json();
      responseBox.innerText = JSON.stringify(data, null, 2);

      if (!data.success) {
        responseBox.classList.add('error');
      }
    } catch (err) {
      responseBox.classList.add('error');
      responseBox.innerText = `Error: ${err.message}`;
    } finally {
      emergencyBtn.disabled = false;
      spinner.style.display = 'none';
      btnText.innerText = 'EMERGENCY BUTTON';
    }
  }
</script>

</body>
</html>
